langcode: en
status: true
dependencies:
  module:
    - content_moderation
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      published: false
      default_revision: false
      weight: 0
    needs_review:
      label: 'Needs Review'
      published: false
      default_revision: false
      weight: 1
    needs_revision:
      label: 'Needs Revision'
      published: false
      default_revision: false
      weight: 2
    published:
      label: Published
      published: true
      default_revision: true
      weight: 3
    archived:
      label: Archived
      published: false
      default_revision: true
      weight: 4
  transitions:
    create_new_draft:
      label: 'Create New Draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    submit_for_review:
      label: 'Submit for Review'
      from:
        - draft
        - needs_revision
      to: needs_review
      weight: 1
    request_revision:
      label: 'Request Revision'
      from:
        - needs_review
      to: needs_revision
      weight: 2
    publish:
      label: Publish
      from:
        - needs_review
        - draft
      to: published
      weight: 3
    archive:
      label: Archive
      from:
        - published
      to: archived
      weight: 4
    restore:
      label: 'Restore to Draft'
      from:
        - archived
      to: draft
      weight: 5
  entity_types:
    node:
      - article
      - page
